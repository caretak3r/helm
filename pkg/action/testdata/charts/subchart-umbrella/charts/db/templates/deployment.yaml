apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/order: "1"
  annotations:
    helm.sh/depends-on: ""
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/instance: {{ .Release.Name }}
        helm.sh/order: "1"
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
