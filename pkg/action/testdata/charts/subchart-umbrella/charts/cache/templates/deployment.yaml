apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cache
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/order: "2"
  annotations:
    helm.sh/depends-on: "db"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
        app.kubernetes.io/instance: {{ .Release.Name }}
        helm.sh/order: "2"
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
