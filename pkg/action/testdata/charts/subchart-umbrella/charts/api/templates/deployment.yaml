apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/order: "3"
  annotations:
    helm.sh/depends-on: "db,cache"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
        helm.sh/order: "3"
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
