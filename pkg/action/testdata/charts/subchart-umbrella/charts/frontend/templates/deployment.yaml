apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/order: "4"
  annotations:
    helm.sh/depends-on: "api"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
        helm.sh/order: "4"
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command:
            - sh
            - -c
            - sleep 3600
